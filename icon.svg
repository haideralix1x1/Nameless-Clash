<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2638"/>
      <stop offset="100%" stop-color="#0d131d"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ea8de"/>
      <stop offset="100%" stop-color="#1d5b8c"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
  </defs>
  <!-- Badge Background -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bgGrad)" stroke="#f77f00" stroke-width="5"/>
  <rect x="11" y="11" width="106" height="106" rx="16" fill="none" stroke="#334763" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- Crossed Blasters Behind Soldier -->
  <g stroke="#11161f" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(64 74) rotate(-32)">
      <rect x="-44" y="-7" width="88" height="14" rx="4" fill="#8d99ae"/>
      <rect x="-24" y="-9" width="38" height="18" rx="3" fill="#495057"/>
      <rect x="34" y="-5" width="12" height="10" rx="2" fill="#f77f00"/>
    </g>
    <g transform="translate(64 74) rotate(32)">
      <rect x="-44" y="-7" width="88" height="14" rx="4" fill="#8d99ae"/>
      <rect x="-24" y="-9" width="38" height="18" rx="3" fill="#495057"/>
      <rect x="34" y="-5" width="12" height="10" rx="2" fill="#f77f00"/>
    </g>
  </g>
  <!-- Jetpack Thruster Flames -->
  <path d="M40 88 L33 114 L46 102 L50 116 L56 90 Z" fill="#ff9f1c"/>
  <path d="M88 88 L95 114 L82 102 L78 116 L72 90 Z" fill="#ff9f1c"/>
  <path d="M43 90 L39 106 L48 96 Z" fill="#fff3b0"/>
  <path d="M85 90 L89 106 L80 96 Z" fill="#fff3b0"/>
  <!-- Tactical Body -->
  <rect x="42" y="68" width="44" height="30" rx="10" fill="#2b4560" stroke="#11161f" stroke-width="4"/>
  <rect x="52" y="73" width="24" height="14" rx="4" fill="#4ea8de" stroke="#11161f" stroke-width="2.5"/>
  <!-- Oversized Mini-Militia Helmet -->
  <circle cx="64" cy="48" r="28" fill="url(#helmetGrad)" stroke="#11161f" stroke-width="4.5"/>
  <!-- Helmet Crest -->
  <rect x="58" y="18" width="12" height="14" rx="4" fill="#f77f00" stroke="#11161f" stroke-width="3"/>
  <!-- Visor Goggles -->
  <rect x="41" y="38" width="46" height="20" rx="9" fill="#18202c" stroke="#11161f" stroke-width="3"/>
  <rect x="45" y="42" width="18" height="12" rx="5" fill="url(#visorGrad)"/>
  <rect x="65" y="42" width="18" height="12" rx="5" fill="url(#visorGrad)"/>
  <!-- Visor Glint -->
  <line x1="48" y1="45" x2="57" y2="45" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="68" y1="45" x2="77" y2="45" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- NC Tag -->
  <rect x="40" y="102" width="48" height="16" rx="6" fill="#d62828" stroke="#11161f" stroke-width="2.5"/>
  <text x="64" y="114" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">CLASH</text>
</svg>
